<title>Contact | Swetha Koppula</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header"><nav class="navbar" aria-label="Primary navigation">
<a class="logo" href="index.html">Swetha</a><button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav-menu">☰ <span>Menu</span></button>

<main id="main-content" class="section">
<header><p class="eyebrow">GET IN TOUCH</p><h1>Contact Me</h1><p>Use the form below to send a message.</p></header>
<form class="contact-form" id="contact-form" action="#" method="post">
<p id="form-help">Fields marked with * are required.</p>
<div class="form-group"><label for="name">Full Name *</label><input id="name" name="name" type="text" autocomplete="name" required aria-required="true"></div>
<div class="form-group"><label for="email">Email Address *</label><input id="email" name="email" type="email" autocomplete="email" required aria-required="true"></div>
<div class="form-group"><label for="subject">Subject *</label><input id="subject" name="subject" type="text" required aria-required="true"></div>
<div class="form-group"><label for="message">Message *</label><textarea id="message" name="message" rows="6" required aria-required="true"></textarea></div>
<button class="button" type="submit">Send Message</button>
<p id="form-status" role="status" aria-live="polite"></p>
</form>
</main>
<footer class="site-footer"><p>&copy; 2026 Swetha Koppula.</p></footer>
<script src="js/script.js"></script>
</body>
</html>
